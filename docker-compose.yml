services:
  db:
    image: postgres:16
    container_name: itline-db
    environment:
      POSTGRES_DB: itline
      POSTGRES_USER: itline
      POSTGRES_PASSWORD: itline
    ports:
      - "5432:5432"
    volumes:
      - itline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itline -d itline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  itline_pgdata: